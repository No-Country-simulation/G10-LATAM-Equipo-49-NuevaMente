[project]
name = "nuevamente-backend"
version = "0.1.0"
description = "Backend de NuevaMente — arquitectura y contratos (CONTRACT-ONLY, sin implementación funcional)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# B (flake8-bugbear) deliberadamente excluido en esta fase: señalaría como
# "sospechosos" los cuerpos de función `...` que son el contrato mismo.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
