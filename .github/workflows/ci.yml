name: CI

# Lint + verificación de imports + tests. Los tests corren con proveedores en
# modo mock (sin credenciales ni red).
#
# Este workflow vive en la RAÍZ del repositorio a propósito: GitHub Actions solo
# lee `.github/workflows/` en la raíz. Estando en `nuevamente/.github/workflows/`
# nunca se ejecutó (confirmado: `gh workflow list` solo mostraba el workflow
# viejo "CI (contract-only)" y sus runs fallaban).

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        # develop anida el proyecto en `nuevamente/`; las rutas de abajo son relativas a esto.
        working-directory: nuevamente/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            nuevamente/backend/requirements.txt
            nuevamente/backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --config pyproject.toml src tests ../ui

      - name: Verificar que todos los módulos importan sin errores
        run: |
          python -c "
          import importlib, pkgutil, src
          for _, name, _ in pkgutil.walk_packages(src.__path__, prefix='src.'):
              importlib.import_module(name)
          print('Todos los módulos de src/ importan correctamente')
          "

      - name: Tests (unitarios + integración)
        run: pytest -q
