name: CI (contract-only)

# En esta fase no hay lógica funcional: el CI solo verifica que la
# ESTRUCTURA del contrato es válida (sintaxis, imports, lint). No instala
# proveedores reales ni ejecuta ningún pipeline.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  contract-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias declarativas
        run: pip install -r requirements.txt

      - name: Lint (ruff) — valida forma del contrato, no lógica
        run: ruff check src

      - name: Verificar que todos los módulos importan sin errores
        run: |
          python -c "
          import importlib, pkgutil, src
          for _, name, _ in pkgutil.walk_packages(src.__path__, prefix='src.'):
              importlib.import_module(name)
          print('Todos los módulos de src/ importan correctamente')
          "

      - name: Recolectar tests (se espera 0 — no hay pytest aún, ver TESTING_STRATEGY.md)
        run: pytest tests/ --collect-only -q
