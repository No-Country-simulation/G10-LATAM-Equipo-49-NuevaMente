services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nuevamente-backend
    env_file:
      - .env
    environment:
      # CAMBIO H-06 INICIO — 2026-10-24
      - LLM_PROVIDER=${LLM_PROVIDER:-cohere}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-cohere}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # CAMBIO H-06 FIN — 2026-10-24
      - STORAGE_PROVIDER=oci
      - OCI_CONFIG_FILE=/root/.oci/config
      - OCI_BUCKET_NAME=bucket-20260921-2152-nuevamente-docs-test
      - OCI_NAMESPACE=axkf02paerjf
      - OCI_PREFIX=
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - DATABASE_URL=sqlite:///./data/sqlite/nuevamente.db
      - MOCK_STORAGE_DIR=/app/data/mock_oci
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    volumes:
      - ./nuevamente/data:/app/data
      - ~/.oci:/root/.oci:ro
      - ~/.ssh/nuevamente.pem:/root/.ssh/nuevamente.pem:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - nuevamente-network

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: nuevamente-ui
    env_file:
      - .env
    environment:
      - API_URL=http://backend:8000
      - PYTHONUNBUFFERED=1
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
    volumes:
      - ./nuevamente/data:/app/data
      - ~/.oci:/root/.oci:ro
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - nuevamente-network

networks:
  nuevamente-network:
    driver: bridge

volumes:
  data: