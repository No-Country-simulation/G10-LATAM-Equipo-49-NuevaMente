name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  LLM_PROVIDER: mock
  EMBEDDING_PROVIDER: mock
  ENVIRONMENT: test

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Preparar carpetas de estado local
        run: mkdir -p ../data/chroma ../data/sqlite ../data/mock_oci ../data/results

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests (pytest, modo mock — Definition of Done, sección 3)
        run: pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Smoke check (la app importa sin errores)
        run: python -c "import src.api.main"

      - name: Auditoría de checklist (Fase 20)
        run: python scripts/audit_checklist.py
