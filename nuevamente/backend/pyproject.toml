[project]
name = "nuevamente-backend"
version = "0.1.0"
description = "Backend de NuevaMente — ingesta, RAG y adaptación con fallback seguro a mock"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests", "api_client", "components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]